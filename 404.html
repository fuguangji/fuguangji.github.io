<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>載入中…… | 光風濟月</title>
    <link href="/main.css" rel="stylesheet" />
    <link href="/novels/novels.css" rel="stylesheet" />
    <style>
      .loading-page {
        min-height: calc(100vh - 70px);
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .loading-card {
        min-width: min(560px, 90vw);
        padding: 3rem 2rem;
      }
      .loading-spinner {
        width: 44px;
        height: 44px;
        margin: 0 auto 1.2rem;
        border: 4px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: loader-spin 0.8s linear infinite;
      }
      .loading-dots {
        display: inline-block;
        min-width: 2.5em;
        text-align: left;
      }
      @keyframes loader-spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <header id="navbar">
      <div class="nav-brand" onclick="location.href = '/'">
        <img src="/assets/logo.png" alt="logo" /><span>光風濟月</span>
      </div>
      <div class="menu_container">
        <button id="menu" onclick="toggleMenu()">☰</button>
        <div class="menu-content" id="menuContent">
          <a href="/#about-me">關於我</a><a href="/novels/">小說</a
          ><a href="/submit/">投稿</a><a href="/game">程式專案</a
          ><a href="javascript:void(0)" onclick="switchTheme()">切換主題</a>
        </div>
      </div>
    </header>
    <main class="main-content">
      <section class="hero-section loading-page" id="loading-page">
        <div class="loading-card">
          <div class="loading-spinner" aria-hidden="true"></div>
          <h1>載入中<span class="loading-dots" id="loading-dots">…</span></h1>
          <p>正在準備你的頁面。</p>
        </div>
      </section>
    </main>
    <script src="/neccessary.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/novels/novels.js"></script>
  </body>
</html>
