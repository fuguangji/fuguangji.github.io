name: Deploy HANEXO

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hanexo-deployment
  cancel-in-progress: false

jobs:
  check-and-deploy:
    name: Check HANEXO updates and deploy when changed
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout website repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout public HANEXO source
        uses: actions/checkout@v4
        with:
          repository: fuguangji/Hanexo
          ref: main
          path: source
          fetch-depth: 1

      - name: Detect source changes
        id: changes
        shell: bash
        run: |
          current_sha="$(git -C source rev-parse HEAD)"
          previous_sha=""
          if [ -f game/.hanexo-source-sha ]; then
            previous_sha="$(cat game/.hanexo-source-sha)"
          fi

          echo "source_sha=$current_sha" >> "$GITHUB_OUTPUT"
          if [ "$current_sha" = "$previous_sha" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "HANEXO has no new commits. Deployment skipped."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "HANEXO changed: $previous_sha -> $current_sha"
          fi

      - name: Set up Node.js
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        working-directory: source
        run: npm install

      - name: Build production site
        if: steps.changes.outputs.changed == 'true'
        working-directory: source
        run: npm run build

      - name: Verify build output
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          if [ ! -s source/dist/index.html ]; then
            echo "::error::Build output is missing source/dist/index.html."
            exit 1
          fi

      - name: Publish HANEXO build
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.changes.outputs.source_sha }}
        run: |
          mkdir -p game/Hanexo
          rsync -a --delete source/dist/ game/Hanexo/
          touch game/Hanexo/.nojekyll
          printf '%s\n' "$SOURCE_SHA" > game/.hanexo-source-sha

      - name: Commit and push deployment
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- game/Hanexo game/.hanexo-source-sha

          if git diff --cached --quiet; then
            echo "Published files are already up to date."
          else
            git commit -m "Deploy HANEXO from ${{ steps.changes.outputs.source_sha }}"
            git push origin HEAD:main
          fi
