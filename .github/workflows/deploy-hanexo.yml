name: Deploy HANEXO

on:
  schedule:
    # HANEXO is private and hosted in a separate repository, so check for new commits.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and publish even if the source commit has not changed
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: deploy-hanexo
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish HANEXO
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout website repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check private repository access token
        id: config
        env:
          HANEXO_TOKEN: ${{ secrets.HANEXO_TOKEN }}
        shell: bash
        run: |
          if [ -z "$HANEXO_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HANEXO_TOKEN is missing. See the HANEXO README for setup."
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Checkout HANEXO source
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          repository: fuguangji/Hanexo
          ref: main
          token: ${{ secrets.HANEXO_TOKEN }}
          path: hanexo-src
          fetch-depth: 1

      - name: Validate source and detect changes
        id: source
        if: steps.config.outputs.configured == 'true'
        env:
          FORCE_DEPLOY: ${{ inputs.force || 'false' }}
        shell: bash
        run: |
          if [ ! -f hanexo-src/package.json ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HANEXO does not have package.json yet; deployment skipped."
            exit 0
          fi

          SOURCE_SHA="$(git -C hanexo-src rev-parse HEAD)"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

          DEPLOYED_SHA=""
          if [ -f .hanexo-deployed-sha ]; then
            DEPLOYED_SHA="$(cat .hanexo-deployed-sha)"
          fi

          if [ "$FORCE_DEPLOY" = "true" ] || [ "$SOURCE_SHA" != "$DEPLOYED_SHA" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "HANEXO is already up to date."
          fi

      - name: Set up Node.js
        if: steps.source.outputs.ready == 'true' && steps.source.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.source.outputs.ready == 'true' && steps.source.outputs.changed == 'true'
        working-directory: hanexo-src
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build production site
        if: steps.source.outputs.ready == 'true' && steps.source.outputs.changed == 'true'
        working-directory: hanexo-src
        run: npm run build

      - name: Verify build output
        if: steps.source.outputs.ready == 'true' && steps.source.outputs.changed == 'true'
        shell: bash
        run: |
          if [ ! -s hanexo-src/dist/index.html ]; then
            echo "::error::Build output is missing dist/index.html."
            exit 1
          fi

      - name: Publish build to website repository
        if: steps.source.outputs.ready == 'true' && steps.source.outputs.changed == 'true'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          mkdir -p game/Hanexo
          rsync -a --delete hanexo-src/dist/ game/Hanexo/
          touch game/Hanexo/.nojekyll
          printf '%s' "$SOURCE_SHA" > .hanexo-deployed-sha

      - name: Commit and push deployment
        if: steps.source.outputs.ready == 'true' && steps.source.outputs.changed == 'true'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- game/Hanexo .hanexo-deployed-sha

          if git diff --cached --quiet; then
            echo "Generated website files are unchanged."
          else
            git commit -m "Deploy HANEXO ($SOURCE_SHA)"
            git push origin HEAD:main
          fi
